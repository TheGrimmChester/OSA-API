# OPA Agent — gitleaks config for SCM / Security runs.
# Extends defaults; allowlists common UI false positives (object keys named
# "key", React key= props) without silencing real credential rules.
title = "OPA Agent AppSec"

[extend]
useDefault = true

# Frontend object-literal `key: '…'` / JSX `key=` FPs for generic-api-key only.
# Real secrets in .env / backend / high-entropy tokens still fail other rules.
[[allowlists]]
description = "UI object key / React key prop false positives (generic-api-key)"
condition = "AND"
targetRules = ["generic-api-key"]
regexTarget = "line"
regexes = [
  '''(?i)(?:^|[,\s{([])['"]?key['"]?\s*:''',
  '''(?i)(?:^|[,\s{([])['"]?keys?['"]?\s*:''',
  '''(?i)\skey\s*=\s*\{?['"`]''',
  '''(?i)Object\.keys\s*\(''',
  '''(?i)(?:apiKey|api_key|secretKey|secret_key)\s*:\s*(?:undefined|null|['"`]\s*['"`]|process\.env)''',
]
paths = [
  '''(?i)\.(jsx?|tsx?|vue|svelte|css|scss|less|mjs|cjs)$''',
  '''(?i)/(src|components|pages|ui|dashboard|public|static|assets)/''',
]

[[allowlists]]
description = "Ignore lockfiles and generated bundles"
paths = [
  '''(?i)(package-lock\.json|yarn\.lock|pnpm-lock\.yaml|composer\.lock|go\.sum)$''',
  '''(?i)/(dist|build|coverage|\.next|node_modules|vendor)/''',
]

# Documentation / *.env.example placeholder handling is deliberately NOT a
# gitleaks allowlist. A `paths` allowlist here applies unconditionally: adding
# docs globs would silence a real credential pasted into a documentation page,
# even alongside `condition = "AND"` and value regexes (verified against
# gitleaks 8.30 — a regex that matches nothing still leaves the path allowlisted).
#
# The rule needs a conjunction — documentation path AND visibly placeholder
# value — so it lives in the finding ingest path instead, where both facts are
# available: see docExampleSecretPath / placeholderSecretValue in
# secret_placeholders.go. That single implementation also covers the embedded
# lite scanner, so both detectors agree.
